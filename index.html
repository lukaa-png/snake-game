<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo da cobrinha feito com HTML, CSS e JavaScript, usando o canvas para desenhar o tabuleiro.">
    <link rel="stylesheet" href="css/style.css">
    <title>Jogo da Cobrinha</title>
</head>
<body>
    <p id="placar">Pontuação: 0</p>
    <canvas id="jogo" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha. Use as setas do teclado para jogar.">
        Seu navegador precisa oferecer suporte a canvas para exibir o jogo.
    </canvas>
    <p>
        <button id="reiniciar" type="button">Reiniciar jogo</button>
    </p>
    <script src="js/script.js"></script>
</body>
</html>
